<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral do simulador</title>
  <desc id="desc">Interface do simulador de coordenadas da Ender 3 com mesa, painel de configuração e G-code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f5ff"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#192b64"/>
      <stop offset="100%" stop-color="#264196"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#192b64" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>

  <rect x="0" y="0" width="1400" height="180" fill="url(#header)"/>
  <text x="120" y="98" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#dfe7ff" letter-spacing="2">SIMULADOR DE IMPRESSÃO 3D</text>
  <text x="120" y="146" font-family="Verdana, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Desafio da Ender 3</text>

  <g filter="url(#shadow)">
    <rect x="100" y="220" width="560" height="490" rx="22" fill="url(#card)"/>
    <text x="140" y="270" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#192b64" font-weight="700">Mesa de impressão</text>
    <text x="140" y="300" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#526184">Área disponível: 220 × 220 mm</text>

    <rect x="140" y="330" width="480" height="320" rx="18" fill="#f1f3fb" stroke="#264196" stroke-width="3"/>
    <g opacity="0.8" stroke="#a7b6ea" stroke-width="1">
      <path d="M140 350 L620 350 M140 390 L620 390 M140 430 L620 430 M140 470 L620 470 M140 510 L620 510 M140 550 L620 550 M140 590 L620 590 M140 630 L620 630"/>
      <path d="M170 330 L170 650 M220 330 L220 650 M270 330 L270 650 M320 330 L320 650 M370 330 L370 650 M420 330 L420 650 M470 330 L470 650 M520 330 L520 650 M570 330 L570 650"/>
    </g>
    <g font-family="Verdana, Arial, sans-serif" font-size="14" fill="#264196">
      <text x="160" y="666">0</text>
      <text x="260" y="666">20</text>
      <text x="360" y="666">40</text>
      <text x="460" y="666">60</text>
      <text x="560" y="666">80</text>
      <text x="125" y="356">80</text>
      <text x="125" y="456">60</text>
      <text x="125" y="556">40</text>
      <text x="125" y="656">20</text>
    </g>
    <path d="M310 420 L470 540" stroke="#7d89fd" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="470" cy="540" r="10" fill="#7d89fd" stroke="#fff" stroke-width="3"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="220" width="560" height="490" rx="22" fill="#ffffff"/>
    <rect x="760" y="260" width="480" height="400" rx="18" fill="#f3f5ff" stroke="#dbe2ff"/>
    <text x="760" y="300" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#192b64" font-weight="700">Gerar percurso</text>
    <rect x="780" y="330" width="440" height="44" rx="10" fill="#ffffff" stroke="#cdd8ff"/>
    <text x="798" y="359" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#526184">Nome do aluno</text>
    <rect x="780" y="390" width="205" height="44" rx="10" fill="#ffffff" stroke="#cdd8ff"/>
    <text x="798" y="419" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#526184">Coordenada X</text>
    <rect x="1015" y="390" width="205" height="44" rx="10" fill="#ffffff" stroke="#cdd8ff"/>
    <text x="1033" y="419" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#526184">Coordenada Y</text>

    <rect x="780" y="460" width="210" height="42" rx="10" fill="#264196"/>
    <text x="840" y="487" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Adicionar posição</text>
    <rect x="1010" y="460" width="210" height="42" rx="10" fill="#edf0ff" stroke="#cdd8ff"/>
    <text x="1060" y="487" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#192b64" font-weight="700">Baixar G-code</text>

    <rect x="780" y="535" width="440" height="86" rx="12" fill="#192b64"/>
    <text x="800" y="572" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#e6eaff">Posição X 120.00 Y 80.00 atualizada.</text>
    <text x="800" y="595" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#e6eaff">O G-code está pronto para download.</text>
  </g>
</svg>
